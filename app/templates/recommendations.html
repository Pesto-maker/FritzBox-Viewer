<!DOCTYPE html>
<html lang="de" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FritzBox Viewer — KI-Empfehlungen</title>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <style>
    :root {
      --fb-bg:       #0d0f1a;
      --fb-surface:  #151929;
      --fb-surface2: #1c2035;
      --fb-border:   #2a2f4a;
      --fb-accent:   #4f6ef7;
      --fb-accent2:  #6ee7f7;
      --fb-text:     #d0d6f0;
      --fb-muted:    #6b728e;
    }

    body {
      background-color: var(--fb-bg);
      color: var(--fb-text);
      font-family: "Segoe UI", system-ui, sans-serif;
      min-height: 100vh;
    }

    .fb-header {
      background: linear-gradient(135deg, #111527 0%, #1a2040 100%);
      border-bottom: 1px solid var(--fb-border);
      padding: 1rem 1.5rem;
    }
    .fb-logo {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(90deg, var(--fb-accent), var(--fb-accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .fb-subtitle { color: var(--fb-muted); font-size: 0.8rem; }

    .card-dark {
      background: var(--fb-surface);
      border: 1px solid var(--fb-border);
      border-radius: 0.75rem;
    }

    /* ── Run group header ──────────────────────────────────────────── */
    .run-header {
      font-size: 0.78rem;
      color: var(--fb-muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 0.4rem 0;
      border-bottom: 1px solid var(--fb-border);
      margin-bottom: 0.75rem;
    }

    /* ── Recommendation card ───────────────────────────────────────── */
    .rec-card {
      background: var(--fb-surface2);
      border: 1px solid var(--fb-border);
      border-radius: 0.5rem;
      padding: 1rem 1.25rem;
      transition: opacity 0.25s;
    }
    .rec-card.status-accepted { border-left: 3px solid #22c55e; }
    .rec-card.status-rejected { border-left: 3px solid #6b728e; opacity: 0.55; }
    .rec-card.status-pending  { border-left: 3px solid var(--fb-accent); }

    .rec-title {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--fb-text);
    }
    .rec-desc {
      font-size: 0.85rem;
      color: var(--fb-muted);
      margin-top: 0.35rem;
      line-height: 1.5;
    }

    /* ── Severity badges ───────────────────────────────────────────── */
    .sev-critical { background: #7f1d1d; color: #fca5a5; }
    .sev-warning  { background: #78350f; color: #fcd34d; }
    .sev-info     { background: #1e3a5f; color: #93c5fd; }

    /* ── Action buttons ────────────────────────────────────────────── */
    .btn-accept {
      font-size: 0.78rem;
      padding: 0.2rem 0.65rem;
      border-radius: 0.35rem;
    }
    .btn-reject {
      font-size: 0.78rem;
      padding: 0.2rem 0.65rem;
      border-radius: 0.35rem;
    }

    /* ── Empty state ───────────────────────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--fb-muted);
    }
    .empty-state i { font-size: 3rem; margin-bottom: 1rem; display: block; }
  </style>
</head>
<body>

<!-- ══════════════════════════════════════════════════════════ HEADER -->
<header class="fb-header d-flex align-items-center justify-content-between flex-wrap gap-2">
  <div>
    <div class="fb-logo"><i class="bi bi-robot me-2"></i>KI-Empfehlungen</div>
    <div class="fb-subtitle">KI-Analyse der FritzBox-Logeinträge</div>
  </div>
  <div class="d-flex align-items-center gap-2">
    <button class="btn btn-sm btn-primary" id="btnAnalyze" onclick="startAnalysis()">
      <i class="bi bi-stars me-1"></i>Neue Analyse starten
    </button>
    <a href="/" class="btn btn-sm btn-outline-secondary">
      <i class="bi bi-arrow-left me-1"></i>Zur Ansicht
    </a>
  </div>
</header>

<!-- ══════════════════════════════════════════════════════════ MAIN -->
<main class="container py-4" style="max-width: 800px;">

  <div id="analyzeResult" class="d-none mb-3"></div>

  <div id="recContainer">
    <!-- filled by JS -->
  </div>

</main>

<!-- ══════════════════════════════════════════════════════════ SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>

  const SEV_LABEL = { critical: "Kritisch", warning: "Warnung", info: "Info" };
  const CAT_ICON  = {
    internet: "bi-wifi",
    wifi:     "bi-broadcast",
    phone:    "bi-telephone",
    security: "bi-shield-exclamation",
    system:   "bi-gear",
    mobile:   "bi-phone",
    info:     "bi-info-circle",
  };

  // ── Load recommendations ─────────────────────────────────────────
  async function loadRecommendations() {
    try {
      const r    = await fetch("/api/ai/recommendations");
      const data = await r.json();
      renderRecommendations(data);
    } catch (e) {
      document.getElementById("recContainer").innerHTML =
        `<div class="alert alert-danger">Fehler beim Laden: ${e.message}</div>`;
    }
  }

  function renderRecommendations(recs) {
    const container = document.getElementById("recContainer");
    if (!recs.length) {
      container.innerHTML = `
        <div class="empty-state">
          <i class="bi bi-robot"></i>
          <p>Noch keine Empfehlungen vorhanden.<br>
          Klicke auf <strong>Neue Analyse starten</strong> um die Logs durch die KI prüfen zu lassen.</p>
        </div>`;
      return;
    }

    // Group by run_id
    const runs = {};
    for (const rec of recs) {
      if (!runs[rec.run_id]) runs[rec.run_id] = [];
      runs[rec.run_id].push(rec);
    }

    let html = "";
    for (const run_id of Object.keys(runs).sort((a, b) => b - a)) {
      const group = runs[run_id];
      const date  = new Date(group[0].created_at);
      const dateStr = date.toLocaleDateString("de-DE", {
        day: "2-digit", month: "2-digit", year: "numeric",
        hour: "2-digit", minute: "2-digit",
      });
      const pending  = group.filter(r => r.status === "pending").length;
      const accepted = group.filter(r => r.status === "accepted").length;
      const rejected = group.filter(r => r.status === "rejected").length;

      html += `
        <div class="card-dark p-4 mb-4">
          <div class="run-header d-flex justify-content-between align-items-center">
            <span><i class="bi bi-clock-history me-1"></i>Analyse vom ${dateStr}</span>
            <span class="d-flex gap-2">
              ${pending  ? `<span class="badge bg-primary">${pending} offen</span>` : ""}
              ${accepted ? `<span class="badge bg-success">${accepted} umgesetzt</span>` : ""}
              ${rejected ? `<span class="badge bg-secondary">${rejected} abgelehnt</span>` : ""}
            </span>
          </div>
          <div class="d-flex flex-column gap-3">
            ${group.map(rec => renderCard(rec)).join("")}
          </div>
        </div>`;
    }
    container.innerHTML = html;
  }

  function renderCard(rec) {
    const sevClass = `sev-${rec.severity}`;
    const sevLabel = SEV_LABEL[rec.severity] || rec.severity;
    const icon     = CAT_ICON[rec.category] || "bi-info-circle";
    const statusClass = `status-${rec.status}`;

    const actionBtns = rec.status === "pending"
      ? `<button class="btn btn-sm btn-outline-success btn-accept" onclick="updateStatus(${rec.id},'accepted',this)">
           <i class="bi bi-check-lg me-1"></i>Umgesetzt
         </button>
         <button class="btn btn-sm btn-outline-secondary btn-reject" onclick="updateStatus(${rec.id},'rejected',this)">
           <i class="bi bi-x-lg me-1"></i>Ablehnen
         </button>`
      : rec.status === "accepted"
        ? `<span class="badge bg-success"><i class="bi bi-check-lg me-1"></i>Umgesetzt</span>
           <button class="btn btn-sm btn-outline-secondary btn-reject ms-1" onclick="updateStatus(${rec.id},'pending',this)" title="Zurücksetzen">
             <i class="bi bi-arrow-counterclockwise"></i>
           </button>`
        : `<span class="badge bg-secondary"><i class="bi bi-x-lg me-1"></i>Abgelehnt</span>
           <button class="btn btn-sm btn-outline-secondary btn-reject ms-1" onclick="updateStatus(${rec.id},'pending',this)" title="Zurücksetzen">
             <i class="bi bi-arrow-counterclockwise"></i>
           </button>`;

    return `
      <div class="rec-card ${statusClass}" id="rec-${rec.id}">
        <div class="d-flex align-items-start justify-content-between gap-2 flex-wrap">
          <div class="d-flex align-items-center gap-2 flex-wrap">
            <span class="badge ${sevClass} px-2 py-1">${sevLabel}</span>
            <i class="bi ${icon}" style="color: var(--fb-muted)"></i>
            <span class="rec-title">${escHtml(rec.title)}</span>
          </div>
          <div class="d-flex align-items-center gap-1 flex-shrink-0">
            ${actionBtns}
          </div>
        </div>
        <div class="rec-desc">${escHtml(rec.description)}</div>
      </div>`;
  }

  // ── Update status ────────────────────────────────────────────────
  async function updateStatus(id, status, btn) {
    btn.disabled = true;
    try {
      const r = await fetch(`/api/ai/recommendations/${id}`, {
        method:  "PATCH",
        headers: {"Content-Type": "application/json"},
        body:    JSON.stringify({status}),
      });
      const data = await r.json();
      if (data.status === "ok") {
        loadRecommendations();
      } else {
        alert("Fehler: " + (data.message || "Unbekannt"));
        btn.disabled = false;
      }
    } catch (e) {
      alert("Netzwerkfehler: " + e.message);
      btn.disabled = false;
    }
  }

  // ── Start analysis ───────────────────────────────────────────────
  async function startAnalysis() {
    const btn    = document.getElementById("btnAnalyze");
    const result = document.getElementById("analyzeResult");

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Analysiere…';
    result.className = "d-none";

    try {
      const r    = await fetch("/api/ai/analyze", {method: "POST"});
      const data = await r.json();

      if (data.status === "ok") {
        showResult("success",
          `<i class="bi bi-check-circle me-2"></i>Analyse abgeschlossen — <strong>${data.count}</strong> neue Empfehlung${data.count !== 1 ? "en" : ""} erstellt.`);
        loadRecommendations();
      } else {
        showResult("danger",
          `<i class="bi bi-exclamation-triangle me-2"></i>${escHtml(data.message || "Unbekannter Fehler.")}`);
      }
    } catch (e) {
      showResult("danger", "Netzwerkfehler: " + e.message);
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-stars me-1"></i>Neue Analyse starten';
    }
  }

  // ── Helpers ──────────────────────────────────────────────────────
  function showResult(type, html) {
    const el = document.getElementById("analyzeResult");
    el.className = `alert alert-${type} py-2`;
    el.innerHTML = html;
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  loadRecommendations();

</script>
</body>
</html>
