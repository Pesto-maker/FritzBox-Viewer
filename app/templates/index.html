<!DOCTYPE html>
<html lang="de" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FritzBox Viewer</title>

  <!-- Bootstrap 5 dark -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <!-- DataTables + Bootstrap 5 integration -->
  <link rel="stylesheet"
        href="https://cdn.datatables.net/2.0.8/css/dataTables.bootstrap5.min.css" />

  <style>
    :root {
      --fb-bg:        #0d0f1a;
      --fb-surface:   #151929;
      --fb-surface2:  #1c2035;
      --fb-border:    #2a2f4a;
      --fb-accent:    #4f6ef7;
      --fb-accent2:   #6ee7f7;
      --fb-text:      #d0d6f0;
      --fb-muted:     #6b728e;
    }

    body {
      background-color: var(--fb-bg);
      color: var(--fb-text);
      font-family: "Segoe UI", system-ui, sans-serif;
      min-height: 100vh;
    }

    /* ── Header ─────────────────────────────────────────────── */
    .fb-header {
      background: linear-gradient(135deg, #111527 0%, #1a2040 100%);
      border-bottom: 1px solid var(--fb-border);
      padding: 1rem 1.5rem;
    }
    .fb-logo {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(90deg, var(--fb-accent), var(--fb-accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .fb-subtitle {
      color: var(--fb-muted);
      font-size: 0.8rem;
    }

    /* ── Stat cards ──────────────────────────────────────────── */
    .stat-card {
      background: var(--fb-surface);
      border: 1px solid var(--fb-border);
      border-radius: 0.6rem;
      padding: 0.75rem 1rem;
      text-align: center;
      transition: border-color .2s;
    }
    .stat-card:hover { border-color: var(--fb-accent); }
    .stat-card .value { font-size: 1.6rem; font-weight: 700; color: var(--fb-accent2); }
    .stat-card .label { font-size: 0.72rem; color: var(--fb-muted); text-transform: uppercase; letter-spacing: .06em; }

    /* ── Status bar ──────────────────────────────────────────── */
    .status-bar {
      background: var(--fb-surface2);
      border: 1px solid var(--fb-border);
      border-radius: 0.5rem;
      padding: 0.5rem 1rem;
      font-size: 0.8rem;
      color: var(--fb-muted);
    }
    .status-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #6b728e;
      margin-right: 6px;
      animation: pulse 2s infinite;
    }
    .status-dot.ok   { background: #22c55e; }
    .status-dot.err  { background: #ef4444; animation: none; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: .3; }
    }

    /* ── Filter buttons ──────────────────────────────────────── */
    .filter-bar { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .btn-filter {
      border-radius: 1rem;
      padding: .25rem .75rem;
      font-size: .78rem;
      font-weight: 600;
      border: 1px solid transparent;
      transition: all .15s;
    }
    .btn-filter.active { box-shadow: 0 0 0 2px var(--fb-accent); }

    /* ── DataTable overrides ─────────────────────────────────── */
    #logTable_wrapper .dataTables_filter input,
    #logTable_wrapper .dataTables_length select {
      background: var(--fb-surface2);
      border: 1px solid var(--fb-border);
      color: var(--fb-text);
      border-radius: 0.4rem;
    }
    #logTable_wrapper .dataTables_filter input:focus,
    #logTable_wrapper .dataTables_length select:focus {
      border-color: var(--fb-accent);
      outline: none;
      box-shadow: 0 0 0 2px rgba(79,110,247,.25);
    }
    #logTable_wrapper .dataTables_info,
    #logTable_wrapper .dataTables_paginate { color: var(--fb-muted); font-size: .8rem; }

    table#logTable {
      background: var(--fb-surface);
      border-color: var(--fb-border);
    }
    table#logTable thead th {
      background: var(--fb-surface2);
      color: var(--fb-accent2);
      border-color: var(--fb-border);
      font-size: .78rem;
      text-transform: uppercase;
      letter-spacing: .06em;
      white-space: nowrap;
    }
    table#logTable tbody tr {
      border-color: var(--fb-border);
      transition: background .1s;
    }
    table#logTable tbody tr:hover { background: var(--fb-surface2) !important; }
    table#logTable tbody td { font-size: .85rem; vertical-align: middle; }

    .page-link { background: var(--fb-surface2) !important; border-color: var(--fb-border) !important; color: var(--fb-text) !important; }
    .page-item.active .page-link { background: var(--fb-accent) !important; border-color: var(--fb-accent) !important; }
    .page-item.disabled .page-link { color: var(--fb-muted) !important; }

    /* ── Category badges ─────────────────────────────────────── */
    .badge-cat {
      font-size: .7rem;
      font-weight: 600;
      padding: .25em .55em;
      border-radius: .4rem;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .cat-error    { background: rgba(239,68,68,.2);   color: #f87171; border: 1px solid rgba(239,68,68,.35); }
    .cat-warning  { background: rgba(234,179,8,.2);   color: #facc15; border: 1px solid rgba(234,179,8,.35); }
    .cat-internet { background: rgba(79,110,247,.2);  color: #818cf8; border: 1px solid rgba(79,110,247,.35); }
    .cat-wifi     { background: rgba(34,211,238,.2);  color: #22d3ee; border: 1px solid rgba(34,211,238,.35); }
    .cat-phone    { background: rgba(34,197,94,.2);   color: #4ade80; border: 1px solid rgba(34,197,94,.35); }
    .cat-mobile   { background: rgba(168,85,247,.2);  color: #c084fc; border: 1px solid rgba(168,85,247,.35); }
    .cat-system   { background: rgba(251,146,60,.2);  color: #fb923c; border: 1px solid rgba(251,146,60,.35); }
    .cat-security { background: rgba(239,68,68,.3);   color: #fca5a5; border: 1px solid rgba(239,68,68,.5); }
    .cat-info     { background: rgba(107,114,142,.2); color: #94a3b8; border: 1px solid rgba(107,114,142,.35); }

    /* ── Misc ────────────────────────────────────────────────── */
    .spinner-sm { width: 1rem; height: 1rem; }
    .card-main {
      background: var(--fb-surface);
      border: 1px solid var(--fb-border);
      border-radius: 0.75rem;
    }
    .ts-cell { color: var(--fb-muted); font-size: .78rem; white-space: nowrap; }
  </style>
</head>
<body>

<!-- ════════════════════════════════════════════════════════════ HEADER -->
<header class="fb-header d-flex align-items-center justify-content-between flex-wrap gap-2">
  <div>
    <div class="fb-logo"><i class="bi bi-router me-2"></i>FritzBox Viewer</div>
    <div class="fb-subtitle">Ereignisprotokoll — FritzBox 6580 5G</div>
  </div>
  <div class="d-flex align-items-center gap-2">
    <div class="status-bar d-flex align-items-center gap-3">
      <span><span class="status-dot" id="statusDot"></span><span id="statusText">Verbinde…</span></span>
      <span id="lastFetch" class="d-none">Letzter Abruf: <strong id="lastFetchTime">—</strong></span>
    </div>
    <button class="btn btn-sm btn-outline-primary" id="btnFetch" onclick="triggerFetch()">
      <i class="bi bi-arrow-clockwise me-1"></i>Jetzt abrufen
    </button>
    <a href="/api/export/logs" class="btn btn-sm btn-outline-light" download>
      <i class="bi bi-download me-1"></i>Export
    </a>
    <a href="/recommendations" class="btn btn-sm btn-outline-info">
      <i class="bi bi-robot me-1"></i>KI-Analyse
    </a>
    <a href="/admin" class="btn btn-sm btn-outline-secondary">
      <i class="bi bi-gear me-1"></i>Admin
    </a>
  </div>
</header>

<!-- ════════════════════════════════════════════════════════════ MAIN -->
<main class="container-fluid p-3 p-md-4">

  <!-- Stat cards -->
  <div class="row g-2 mb-3" id="statCards">
    <div class="col-6 col-sm-4 col-md-2">
      <div class="stat-card"><div class="value" id="statTotal">—</div><div class="label">Gesamt</div></div>
    </div>
    <div class="col-6 col-sm-4 col-md-2">
      <div class="stat-card"><div class="value text-danger" id="statError">—</div><div class="label">Fehler</div></div>
    </div>
    <div class="col-6 col-sm-4 col-md-2">
      <div class="stat-card"><div class="value text-warning" id="statWarning">—</div><div class="label">Warnungen</div></div>
    </div>
    <div class="col-6 col-sm-4 col-md-2">
      <div class="stat-card"><div class="value" style="color:#818cf8" id="statInternet">—</div><div class="label">Internet</div></div>
    </div>
    <div class="col-6 col-sm-4 col-md-2">
      <div class="stat-card"><div class="value" style="color:#22d3ee" id="statWifi">—</div><div class="label">WLAN</div></div>
    </div>
    <div class="col-6 col-sm-4 col-md-2">
      <div class="stat-card"><div class="value" style="color:#4ade80" id="statOther">—</div><div class="label">Sonstige</div></div>
    </div>
  </div>

  <!-- Error alert -->
  <div id="errorAlert" class="alert alert-danger d-none py-2 mb-3" role="alert">
    <i class="bi bi-exclamation-triangle-fill me-2"></i>
    <span id="errorMsg"></span>
  </div>

  <!-- Table card -->
  <div class="card-main p-3">
    <!-- Filter bar -->
    <div class="filter-bar mb-3" id="filterBar">
      <button class="btn-filter btn btn-secondary active" data-cat="">
        <i class="bi bi-list-ul me-1"></i>Alle
      </button>
      <button class="btn-filter btn btn-outline-danger" data-cat="error">Fehler</button>
      <button class="btn-filter btn btn-outline-warning" data-cat="warning">Warnung</button>
      <button class="btn-filter btn btn-outline-primary" data-cat="internet">Internet</button>
      <button class="btn-filter btn btn-outline-info" data-cat="wifi">WLAN</button>
      <button class="btn-filter btn btn-outline-success" data-cat="phone">Telefon</button>
      <button class="btn-filter btn btn-outline-secondary" data-cat="mobile" style="color:#c084fc;border-color:#c084fc">Mobile</button>
      <button class="btn-filter btn btn-outline-warning" data-cat="system" style="color:#fb923c;border-color:#fb923c">System</button>
      <button class="btn-filter btn btn-outline-danger" data-cat="security" style="color:#fca5a5;border-color:#f87171">Sicherheit</button>
      <button class="btn-filter btn btn-outline-secondary" data-cat="info">Info</button>
    </div>

    <!-- Table -->
    <div class="table-responsive">
      <table id="logTable" class="table table-dark table-hover table-sm w-100">
        <thead>
          <tr>
            <th>Zeitstempel</th>
            <th>Kategorie</th>
            <th>Nachricht</th>
          </tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
      </table>
    </div>
  </div>
</main>

<!-- ════════════════════════════════════════════════════════════ SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/2.0.8/js/dataTables.min.js"></script>
<script src="https://cdn.datatables.net/2.0.8/js/dataTables.bootstrap5.min.js"></script>

<script>
  // ── state ──────────────────────────────────────────────────────────────
  let activeCategory = "";
  let table = null;
  let allData  = [];

  // ── DataTable init ──────────────────────────────────────────────────────
  $(document).ready(function () {
    table = $('#logTable').DataTable({
      data: [],
      columns: [
        { data: 'timestamp', title: 'Zeitstempel',
          render: (d) => `<span class="ts-cell">${formatTs(d)}</span>` },
        { data: 'category',  title: 'Kategorie',
          render: (d) => `<span class="badge-cat cat-${d}">${catLabel(d)}</span>` },
        { data: 'message',   title: 'Nachricht', orderable: false }
      ],
      order: [[0, 'desc']],
      pageLength: 50,
      lengthMenu: [25, 50, 100, 250, 500],
      language: {
        search:          'Suche:',
        lengthMenu:      '_MENU_ Einträge',
        info:            '_START_–_END_ von _TOTAL_ Einträgen',
        infoEmpty:       '0 Einträge',
        infoFiltered:    '(gefiltert von _MAX_)',
        paginate: { first:'«', last:'»', next:'›', previous:'‹' },
        emptyTable:      'Keine Daten vorhanden',
        zeroRecords:     'Keine Übereinstimmungen gefunden'
      },
      dom: '<"row align-items-center mb-2"<"col-sm-6"l><"col-sm-6"f>>rt<"row align-items-center mt-2"<"col-sm-6"i><"col-sm-6"p>>',
    });

    loadStats();
    loadLogs();

    // auto refresh every 60 s
    setInterval(() => { loadStats(); loadLogs(); }, 60000);

    // category filter buttons
    document.querySelectorAll('.btn-filter').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeCategory = btn.dataset.cat;
        renderTable();
      });
    });
  });

  // ── data loading ────────────────────────────────────────────────────────
  async function loadLogs() {
    try {
      const res  = await fetch('/api/logs?limit=2000');
      const json = await res.json();
      allData = json.entries;
      renderTable();
    } catch(e) {
      showError('Fehler beim Laden der Logs: ' + e.message);
    }
  }

  async function loadStats() {
    try {
      const res  = await fetch('/api/stats');
      const json = await res.json();

      document.getElementById('statTotal').textContent   = json.total ?? 0;
      document.getElementById('statError').textContent   = json.by_category?.error    ?? 0;
      document.getElementById('statWarning').textContent = json.by_category?.warning  ?? 0;
      document.getElementById('statInternet').textContent= json.by_category?.internet ?? 0;
      document.getElementById('statWifi').textContent    = json.by_category?.wifi     ?? 0;

      const other = (json.total ?? 0)
        - (json.by_category?.error    ?? 0)
        - (json.by_category?.warning  ?? 0)
        - (json.by_category?.internet ?? 0)
        - (json.by_category?.wifi     ?? 0);
      document.getElementById('statOther').textContent = Math.max(0, other);

      const dot  = document.getElementById('statusDot');
      const txt  = document.getElementById('statusText');
      if (json.last_error) {
        dot.className = 'status-dot err';
        txt.textContent = 'Letzter Fehler: ' + json.last_error.substring(0, 80);
        showError(json.last_error);
      } else {
        dot.className = 'status-dot ok';
        txt.textContent = 'Verbunden';
        document.getElementById('errorAlert').classList.add('d-none');
      }

      if (json.last_fetch) {
        document.getElementById('lastFetch').classList.remove('d-none');
        document.getElementById('lastFetchTime').textContent = formatTs(json.last_fetch);
      }
    } catch(e) {
      document.getElementById('statusDot').className = 'status-dot err';
      document.getElementById('statusText').textContent = 'API nicht erreichbar';
    }
  }

  function renderTable() {
    let data = allData;
    if (activeCategory) {
      data = data.filter(e => e.category === activeCategory);
    }
    table.clear().rows.add(data).draw();
  }

  // ── manual fetch ────────────────────────────────────────────────────────
  async function triggerFetch() {
    const btn = document.getElementById('btnFetch');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-sm me-1" role="status"></span>Lädt…';
    try {
      await fetch('/api/fetch', { method: 'POST' });
      await loadStats();
      await loadLogs();
    } catch(e) {
      showError('Manueller Abruf fehlgeschlagen: ' + e.message);
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-arrow-clockwise me-1"></i>Jetzt abrufen';
    }
  }

  // ── helpers ─────────────────────────────────────────────────────────────
  function formatTs(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    return d.toLocaleString('de-DE', {
      day:'2-digit', month:'2-digit', year:'2-digit',
      hour:'2-digit', minute:'2-digit', second:'2-digit'
    });
  }

  const CAT_LABELS = {
    error:'Fehler', warning:'Warnung', internet:'Internet', wifi:'WLAN',
    phone:'Telefon', mobile:'Mobile', system:'System', security:'Sicherheit', info:'Info'
  };
  function catLabel(cat) { return CAT_LABELS[cat] ?? cat; }

  function showError(msg) {
    document.getElementById('errorMsg').textContent = msg;
    document.getElementById('errorAlert').classList.remove('d-none');
  }
</script>
</body>
</html>
